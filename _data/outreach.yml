intro: PEARL Lab is committed to sharing the excitement of planetary science with students and the general public. Through diverse outreach initiatives, we work to inspire curiosity about planetary processes and make science accessible to all.

blocks:
  - title: Dublin School Partnerships
    image: /assets/images/Outreach_School.JPG
    body: We partner with local schools to bring hands-on planetary science activities into classrooms. Students learn about meteorites, planetary formation, and the processes that shape our solar system through interactive demonstrations and inquiry-based learning experiences.

  - title: Get Involved
    image: /assets/images/placeholder_geode.jpeg
    body: Interested in collaborating on outreach or educational activities? We welcome partnerships with educators, institutions, and community organisations. Contact us to discuss customised programs and collaboration opportunities suited to your needs.
