intro: PEARL Lab is committed to sharing the excitement of planetary science with students and the general public. Through diverse outreach initiatives, we work to inspire curiosity about planetary processes and make science accessible to all.

blocks:
  - title: K-12 School Partnerships
    image: /assets/images/outreach-k12.jpg
    body: We partner with local schools to bring hands-on planetary science activities into classrooms. Students learn about meteorites, planetary formation, and the processes that shape our solar system through interactive demonstrations and inquiry-based learning experiences.

  - title: University Mentorship & Research Opportunities
    image: /assets/images/outreach-mentorship.jpg
    body: Our lab provides research opportunities for undergraduate and graduate students, offering mentorship in analytical techniques, data interpretation, and scientific communication. Students gain hands-on experience with cutting-edge methods in geochemistry and isotope analysis.

  - title: Public Engagement & Science Cafés
    image: /assets/images/outreach-public.jpg
    body: Regular public lectures and science café events introduce diverse audiences to recent discoveries in planetary science. We discuss how we investigate planetary materials and what they tell us about our solar system's history.

  - title: Museum & Institution Collaborations
    image: /assets/images/outreach-museum.jpg
    body: We collaborate with science museums and educational institutions to develop exhibits and programs that make planetary science engaging and accessible. Our sample collections and expertise support classroom demonstrations and museum displays.

  - title: Resources & Sample Collections
    image: /assets/images/outreach-samples.jpg
    body: PEARL maintains a curated collection of meteorite samples available for classroom demonstrations and educational outreach. These tangible connections to planetary science help students understand the real materials that scientists study.

  - title: Get Involved
    image: /assets/images/outreach-involved.jpg
    body: Interested in collaborating on outreach or educational activities? We welcome partnerships with educators, institutions, and community organizations. Contact us to discuss customized programs and collaboration opportunities suited to your needs.
