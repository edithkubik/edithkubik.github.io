- title: Research Ireland Pathway Fellowship
  description: Edith Kubik received a €675,000 four-year fellowship funded by Research Ireland allowing the group to continue their research at University College Dublin starting in 2025.
  image: /assets/images/REg.png

- title: Measuring stable isotopes at UCD
  description: The PEARL team currently develops a range of metal stable isotope techniques to investigage planetary formation and differentiation at the National Centre for Isotope Geochemistry. PEARL is the only lab in Ireland with the non-traditional stable isotope expertise. Image credit: NASA/JPL-Caltech
  image: /assets/images/The_Mysterious_Case_of_the_Disappearing_Dust.jpg

- title: Isotope metallomics in Ireland
  description: The group currently develops isotopic techniques which can be used to investigate biochemical pathways in biological tissues and organs. These methods will be used to research potential diagnosis tools for conditions that are particularly prevalent in Ireland.
  image: /assets/images/Neoma.png
